name: Test ForgeHub

on:
  push:
    paths:
      - "ForgeHub/**"
      - ".github/workflows/test-forgehub.yml"
  pull_request:
    paths:
      - "ForgeHub/**"
      - ".github/workflows/test-forgehub.yml"

permissions:
  contents: read

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ForgeHub/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - run: go test ./...
