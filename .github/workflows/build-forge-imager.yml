name: Build ForgeImager (Cloud CI/CD)

on:
  push:
    branches:
      - main
    paths:
      - 'ForgeImager/**'
      - '.github/workflows/build-forge-imager.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: ForgeImager

env:
  NODE_VERSION: '20'

jobs:
  build-linux-arm64:
    name: Build Linux ARM64 (BTV E10 / SBCs)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            squashfs-tools \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ForgeImager/package-lock.json

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri App (ARM64 AppImage & Deb)
        run: cargo tauri build --bundles deb,appimage

      - name: Upload Linux ARM64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-imager-linux-arm64
          path: |
            ForgeImager/src-tauri/target/release/bundle/deb/*.deb
            ForgeImager/src-tauri/target/release/bundle/appimage/*.AppImage

  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            squashfs-tools \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ForgeImager/package-lock.json

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri App (AppImage & Deb)
        run: cargo tauri build --bundles deb,appimage

      - name: Upload Linux x64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-imager-linux-x64
          path: |
            ForgeImager/src-tauri/target/release/bundle/deb/*.deb
            ForgeImager/src-tauri/target/release/bundle/appimage/*.AppImage

  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ForgeImager/package-lock.json

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri App (.exe & .msi)
        run: cargo tauri build --bundles msi,nsis

      - name: Upload Windows x64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-imager-windows-x64
          path: |
            ForgeImager/src-tauri/target/release/bundle/msi/*.msi
            ForgeImager/src-tauri/target/release/bundle/nsis/*.exe
